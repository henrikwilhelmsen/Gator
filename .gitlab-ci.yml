image: golang:1.26-alpine
stages:
  - dependencies
  - build
  - lint
  - test
variables:
  GOPROXY: "https://proxy.golang.org"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: 0
  GOPATH: "$CI_PROJECT_DIR/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

.go_cache: &go_cache
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .cache/go-build
      - go/pkg/mod

resolve_dependencies:
  stage: dependencies
  <<: *go_cache
  script:
    - go mod download

build_binary:
  stage: build
  <<: *go_cache
  script:
    - go build -v -ldflags "-s -w" -o gator
  artifacts:
    paths:
      - gator

golangci_lint:
  stage: lint
  image: golangci/golangci-lint:v2.12.2
  script:
    - golangci-lint run --output.checkstyle.path=report.xml
  artifacts:
    reports:
      codequality: report.xml

run_tests:
  stage: test
  <<: *go_cache
  variables:
    # Required for the -race flag
    CGO_ENABLED: 1
  before_script:
    # Needed for cgo
    - apk add --no-cache build-base
  script:
    - go test ./... -coverprofile=coverage.txt -covermode atomic -v -race
    - go get github.com/boumenot/gocover-cobertura
    - go run github.com/boumenot/gocover-cobertura < coverage.txt > coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
