image: golang:1.27-alpine
stages:
  - dependencies
  - build
  - lint
  - test
variables:
  GOPROXY: "https://proxy.golang.org"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: 0
  GOPATH: "$CI_PROJECT_DIR/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

.go_cache: &go_cache
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .cache/go-build
      - go/pkg/mod

resolve_dependencies:
  stage: dependencies
  <<: *go_cache
  script:
    - go mod download

build_binary:
  stage: build
  <<: *go_cache
  script:
    - go build -v -ldflags "-s -w" -o gator
  artifacts:
    paths:
      - gator

golangci_lint:
  stage: lint
  image: golangci/golangci-lint:v2.13.2
  script:
    - golangci-lint run --output.checkstyle.path=report.xml
  artifacts:
    reports:
      codequality: report.xml

run_tests:
  stage: test
  <<: *go_cache
  variables:
    # Required for the -race flag
    CGO_ENABLED: 1
  before_script:
    # Use su-exec to run as non-root postgres user. Could be moved to a custom image long-term.
    # build-base is required for cgo; postgrestest requires initdb and pg_ctl.
    - apk add --no-cache build-base postgresql su-exec
    - mkdir -p "$GOPATH" "$GOCACHE"
    - chown -R postgres:postgres "$CI_PROJECT_DIR"
  script:
    - su-exec postgres go test ./... -coverprofile=coverage.txt -covermode atomic -v -race
    - su-exec postgres go get github.com/boumenot/gocover-cobertura
    - su-exec postgres sh -c 'go run github.com/boumenot/gocover-cobertura < coverage.txt > coverage.xml'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
